<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>NEON VAULT</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        :root {
            --pink: #ff2a6d;
            --cyan: #05d9e8;
            --dark: #08080a;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            height: 100%;
            background: var(--dark);
            overflow: hidden;
            font-family: 'Press Start 2P', monospace;
        }

        /* scanlines */
        body::after {
            content: "";
            position: fixed;
            inset: 0;
            background: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 2px,
                rgba(0, 0, 0, 0.06) 2px,
                rgba(0, 0, 0, 0.06) 4px
            );
            pointer-events: none;
            z-index: 9999;
        }

        #game-frame {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
            background: #000;
        }

        /* back button */
        .back-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 9998;
            background: rgba(8, 8, 10, 0.85);
            border: 1px solid rgba(255, 42, 109, 0.3);
            color: var(--pink);
            font-family: 'Press Start 2P', monospace;
            font-size: 9px;
            letter-spacing: 2px;
            padding: 10px 18px;
            cursor: pointer;
            text-decoration: none;
            transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
        }

        .back-btn:hover {
            border-color: var(--pink);
            box-shadow: 0 0 15px rgba(255, 42, 109, 0.3);
            background: rgba(255, 42, 109, 0.08);
        }

        .back-btn::before {
            content: "\2190";
            margin-right: 10px;
        }

        /* loading overlay */
        #loading-overlay {
            position: fixed;
            inset: 0;
            background: var(--dark);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9997;
            transition: opacity 0.4s;
        }

        #loading-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        #loading-overlay h2 {
            font-size: 14px;
            color: var(--pink);
            text-shadow: 0 0 15px rgba(255, 42, 109, 0.5);
            animation: flicker 0.15s infinite alternate;
            letter-spacing: 4px;
        }

        .loading-bar-track {
            width: 200px;
            height: 3px;
            background: #1a1a22;
            margin-top: 24px;
            position: relative;
            overflow: hidden;
        }

        .loading-bar-fill {
            height: 100%;
            background: var(--pink);
            box-shadow: 0 0 8px var(--pink);
            width: 0%;
            animation: load-fill 2s ease-out forwards;
        }

        @keyframes load-fill {
            0% { width: 0%; }
            60% { width: 70%; }
            100% { width: 95%; }
        }

        @keyframes flicker {
            0% { opacity: 1; }
            50% { opacity: 0.7; }
            100% { opacity: 1; }
        }

        /* fullscreen toggle */
        .fs-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9998;
            background: rgba(8, 8, 10, 0.85);
            border: 1px solid rgba(5, 217, 232, 0.3);
            color: var(--cyan);
            font-family: 'Press Start 2P', monospace;
            font-size: 9px;
            letter-spacing: 2px;
            padding: 10px 18px;
            cursor: pointer;
            text-decoration: none;
            transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
        }

        .fs-btn:hover {
            border-color: var(--cyan);
            box-shadow: 0 0 15px rgba(5, 217, 232, 0.3);
            background: rgba(5, 217, 232, 0.08);
        }
    </style>
</head>
<body>

    <a href="index.html" class="back-btn">BACK</a>
    <button class="fs-btn" id="fs-btn" title="Fullscreen">FULL</button>

    <div id="loading-overlay">
        <h2>LOADING</h2>
        <div class="loading-bar-track">
            <div class="loading-bar-fill"></div>
        </div>
    </div>

    <iframe id="game-frame" allowfullscreen></iframe>

    <script>
        const GAMES_DATA = [
  {
    "id": "hotline-miami",
    "title": "HOTLINE MIAMI",
    "path": "games/hotline-miami/index.html"
  },
  {
    "id": "cuphead",
    "title": "CUPHEAD",
    "path": "games/cuphead/cuphead-main/index.html"
  },
  {
    "id": "getting-over-it",
    "title": "GETTING OVER IT",
    "path": "games/getting-over-it/index.html"
  }
];

        const params = new URLSearchParams(window.location.search);
        const gameId = params.get('game');

        if (!gameId) {
            window.location.href = 'index.html';
        }

        const game = GAMES_DATA.find(g => g.id === gameId);
        if (!game) {
            window.location.href = 'index.html';
        } else {
            document.title = game.title + ' - NEON VAULT';
            const frame = document.getElementById('game-frame');
            frame.src = game.path;

            frame.onload = () => {
                setTimeout(() => {
                    document.getElementById('loading-overlay').classList.add('hidden');
                }, 1500);
            };
        }

        document.getElementById('fs-btn').addEventListener('click', () => {
            const el = document.documentElement;
            if (!document.fullscreenElement) {
                (el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen).call(el);
            } else {
                (document.exitFullscreen || document.webkitExitFullscreen || document.msExitFullscreen).call(document);
            }
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && !document.fullscreenElement) {
                window.location.href = 'index.html';
            }
        });
    </script>

</body>
</html>
